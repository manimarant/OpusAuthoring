<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#98FB98;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.7" />
    </radialGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="800" height="300" fill="url(#skyGradient)"/>
  
  <!-- Ground -->
  <rect x="0" y="300" width="800" height="150" fill="#8B7355"/>
  <rect x="0" y="300" width="800" height="20" fill="#90EE90"/>
  
  <!-- Sun -->
  <circle cx="650" cy="100" r="40" fill="url(#sunGradient)"/>
  <g stroke="#FFD700" stroke-width="3" opacity="0.6">
    <line x1="650" y1="40" x2="650" y2="20"/>
    <line x1="650" y1="180" x2="650" y2="160"/>
    <line x1="590" y1="100" x2="610" y2="100"/>
    <line x1="690" y1="100" x2="710" y2="100"/>
    <line x1="608" y1="58" x2="622" y2="72"/>
    <line x1="678" y1="128" x2="692" y2="142"/>
    <line x1="692" y1="58" x2="678" y2="72"/>
    <line x1="622" y1="128" x2="608" y2="142"/>
  </g>
  
  <!-- Clouds -->
  <g fill="rgba(255,255,255,0.8)">
    <circle cx="150" cy="80" r="20"/>
    <circle cx="170" cy="80" r="25"/>
    <circle cx="190" cy="80" r="20"/>
    <circle cx="130" cy="80" r="18"/>
    
    <circle cx="500" cy="120" r="15"/>
    <circle cx="515" cy="120" r="20"/>
    <circle cx="530" cy="120" r="15"/>
  </g>
  
  <!-- Tree stages showing growth -->
  
  <!-- Stage 1: Seed/Sprout -->
  <g transform="translate(100, 350)">
    <ellipse cx="0" cy="20" rx="8" ry="4" fill="#654321"/>
    <rect x="-1" y="10" width="2" height="10" fill="#228B22"/>
    <ellipse cx="-3" cy="8" rx="3" ry="5" fill="url(#leafGradient)"/>
    <ellipse cx="3" cy="8" rx="3" ry="5" fill="url(#leafGradient)"/>
    
    <!-- Growth arrows -->
    <path d="M30,0 L40,10 L35,10 L35,20 L25,20 L25,10 L20,10 Z" fill="#4CAF50"/>
  </g>
  
  <!-- Stage 2: Small plant -->
  <g transform="translate(200, 320)">
    <rect x="-2" y="30" width="4" height="50" fill="#8B4513"/>
    
    <!-- Leaves -->
    <ellipse cx="-8" cy="25" rx="6" ry="10" fill="url(#leafGradient)"/>
    <ellipse cx="8" cy="25" rx="6" ry="10" fill="url(#leafGradient)"/>
    <ellipse cx="-6" cy="40" rx="5" ry="8" fill="url(#leafGradient)"/>
    <ellipse cx="6" cy="40" rx="5" ry="8" fill="url(#leafGradient)"/>
    
    <!-- Growth arrows -->
    <path d="M30,0 L40,10 L35,10 L35,20 L25,20 L25,10 L20,10 Z" fill="#4CAF50"/>
  </g>
  
  <!-- Stage 3: Young tree -->
  <g transform="translate(300, 280)">
    <rect x="-4" y="50" width="8" height="100" fill="#8B4513"/>
    
    <!-- Branches -->
    <rect x="-15" y="40" width="12" height="4" fill="#8B4513" rx="2"/>
    <rect x="3" y="40" width="12" height="4" fill="#8B4513" rx="2"/>
    <rect x="-20" y="60" width="15" height="4" fill="#8B4513" rx="2"/>
    <rect x="5" y="60" width="15" height="4" fill="#8B4513" rx="2"/>
    
    <!-- Leaves -->
    <circle cx="-15" cy="35" r="12" fill="url(#leafGradient)"/>
    <circle cx="15" cy="35" r="12" fill="url(#leafGradient)"/>
    <circle cx="-20" cy="55" r="10" fill="url(#leafGradient)"/>
    <circle cx="20" cy="55" r="10" fill="url(#leafGradient)"/>
    
    <!-- Growth arrows -->
    <path d="M30,0 L40,10 L35,10 L35,20 L25,20 L25,10 L20,10 Z" fill="#4CAF50"/>
  </g>
  
  <!-- Stage 4: Mature tree -->
  <g transform="translate(450, 200)">
    <rect x="-8" y="100" width="16" height="200" fill="#8B4513"/>
    
    <!-- Main branches -->
    <rect x="-30" y="80" width="25" height="8" fill="#8B4513" rx="4"/>
    <rect x="5" y="80" width="25" height="8" fill="#8B4513" rx="4"/>
    <rect x="-35" y="120" width="30" height="8" fill="#8B4513" rx="4"/>
    <rect x="5" y="120" width="30" height="8" fill="#8B4513" rx="4"/>
    
    <!-- Large canopy -->
    <circle cx="-25" cy="70" r="25" fill="url(#leafGradient)"/>
    <circle cx="25" cy="70" r="25" fill="url(#leafGradient)"/>
    <circle cx="-30" cy="110" r="20" fill="url(#leafGradient)"/>
    <circle cx="30" cy="110" r="20" fill="url(#leafGradient)"/>
    <circle cx="0" cy="60" r="30" fill="url(#leafGradient)"/>
    
    <!-- Growth arrows -->
    <path d="M50,0 L60,10 L55,10 L55,20 L45,20 L45,10 L40,10 Z" fill="#4CAF50"/>
  </g>
  
  <!-- Stage 5: Full grown tree with fruits -->
  <g transform="translate(600, 150)">
    <rect x="-12" y="150" width="24" height="300" fill="#8B4513"/>
    
    <!-- Complex branch system -->
    <rect x="-40" y="120" width="35" height="10" fill="#8B4513" rx="5"/>
    <rect x="5" y="120" width="35" height="10" fill="#8B4513" rx="5"/>
    <rect x="-45" y="160" width="40" height="10" fill="#8B4513" rx="5"/>
    <rect x="5" y="160" width="40" height="10" fill="#8B4513" rx="5"/>
    <rect x="-25" y="90" width="20" height="8" fill="#8B4513" rx="4"/>
    <rect x="5" y="90" width="20" height="8" fill="#8B4513" rx="4"/>
    
    <!-- Full canopy -->
    <circle cx="-35" cy="110" r="30" fill="url(#leafGradient)"/>
    <circle cx="35" cy="110" r="30" fill="url(#leafGradient)"/>
    <circle cx="-40" cy="150" r="25" fill="url(#leafGradient)"/>
    <circle cx="40" cy="150" r="25" fill="url(#leafGradient)"/>
    <circle cx="0" cy="80" r="35" fill="url(#leafGradient)"/>
    <circle cx="-15" cy="130" r="28" fill="url(#leafGradient)"/>
    <circle cx="15" cy="130" r="28" fill="url(#leafGradient)"/>
    
    <!-- Fruits -->
    <circle cx="-30" cy="105" r="4" fill="#FF6B6B"/>
    <circle cx="30" cy="115" r="4" fill="#FF6B6B"/>
    <circle cx="-10" cy="125" r="4" fill="#FF6B6B"/>
    <circle cx="20" cy="135" r="4" fill="#FF6B6B"/>
    <circle cx="-35" cy="145" r="4" fill="#FF6B6B"/>
  </g>
  
  <!-- Roots underground (visible through transparent soil) -->
  <g fill="rgba(139, 115, 85, 0.6)">
    <ellipse cx="450" cy="350" rx="30" ry="10"/>
    <ellipse cx="600" cy="380" rx="40" ry="15"/>
  </g>
  
  <!-- Growth chart/measurement marks -->
  <g stroke="#666" stroke-width="2" fill="none">
    <line x1="50" y1="450" x2="50" y2="150"/>
    <!-- Height markers -->
    <line x1="45" y1="400" x2="55" y2="400"/>
    <line x1="45" y1="350" x2="55" y2="350"/>
    <line x1="45" y1="300" x2="55" y2="300"/>
    <line x1="45" y1="250" x2="55" y2="250"/>
    <line x1="45" y1="200" x2="55" y2="200"/>
    <line x1="45" y1="150" x2="55" y2="150"/>
  </g>
  
  <!-- Height labels -->
  <text x="30" y="405" font-family="Arial, sans-serif" font-size="12" fill="#666">1m</text>
  <text x="30" y="355" font-family="Arial, sans-serif" font-size="12" fill="#666">2m</text>
  <text x="30" y="305" font-family="Arial, sans-serif" font-size="12" fill="#666">3m</text>
  <text x="30" y="255" font-family="Arial, sans-serif" font-size="12" fill="#666">4m</text>
  <text x="30" y="205" font-family="Arial, sans-serif" font-size="12" fill="#666">5m</text>
  <text x="30" y="155" font-family="Arial, sans-serif" font-size="12" fill="#666">6m</text>
  
  <!-- Birds flying -->
  <g stroke="#333" stroke-width="2" fill="none">
    <path d="M100,150 Q105,145 110,150 Q115,155 120,150"/>
    <path d="M130,140 Q135,135 140,140 Q145,145 150,140"/>
    <path d="M700,120 Q705,115 710,120 Q715,125 720,120"/>
  </g>
  
  <!-- Butterfly -->
  <g transform="translate(350, 200)">
    <ellipse cx="0" cy="0" rx="3" ry="8" fill="#FF69B4" opacity="0.7"/>
    <ellipse cx="-2" cy="-3" rx="6" ry="4" fill="#FF1493" opacity="0.8"/>
    <ellipse cx="2" cy="-3" rx="6" ry="4" fill="#FF1493" opacity="0.8"/>
    <ellipse cx="-2" cy="3" rx="4" ry="3" fill="#FF69B4" opacity="0.8"/>
    <ellipse cx="2" cy="3" rx="4" ry="3" fill="#FF69B4" opacity="0.8"/>
    <line x1="0" y1="-8" x2="0" y2="-12" stroke="#333" stroke-width="1"/>
    <line x1="0" y1="-8" x2="0" y2="-12" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2E8B57">GROWTH</text>
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(46,139,87,0.8)">Nature &amp; Development</text>
</svg>