<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#techGradient2)"/>
  
  <!-- Dashboard frame -->
  <rect x="100" y="120" width="600" height="250" rx="10" fill="rgba(255,255,255,0.95)"/>
  
  <!-- Chart 1 - Bar Chart -->
  <g transform="translate(130, 150)">
    <rect x="0" y="60" width="15" height="40" fill="#4CAF50"/>
    <rect x="20" y="40" width="15" height="60" fill="#2196F3"/>
    <rect x="40" y="50" width="15" height="50" fill="#FF9800"/>
    <rect x="60" y="30" width="15" height="70" fill="#E91E63"/>
    <rect x="80" y="45" width="15" height="55" fill="#9C27B0"/>
  </g>
  
  <!-- Chart 2 - Line Chart -->
  <g transform="translate(300, 150)">
    <polyline points="0,80 20,60 40,40 60,20 80,30 100,10" stroke="#00BCD4" stroke-width="3" fill="none"/>
    <polyline points="0,70 20,65 40,50 60,45 80,35 100,25" stroke="#FFC107" stroke-width="3" fill="none"/>
    <!-- Data points -->
    <circle cx="0" cy="80" r="3" fill="#00BCD4"/>
    <circle cx="20" cy="60" r="3" fill="#00BCD4"/>
    <circle cx="40" cy="40" r="3" fill="#00BCD4"/>
    <circle cx="60" cy="20" r="3" fill="#00BCD4"/>
    <circle cx="80" cy="30" r="3" fill="#00BCD4"/>
    <circle cx="100" cy="10" r="3" fill="#00BCD4"/>
  </g>
  
  <!-- Chart 3 - Pie Chart -->
  <g transform="translate(550, 200)">
    <circle cx="0" cy="0" r="40" fill="#4CAF50" stroke="white" stroke-width="2"/>
    <path d="M0,0 L0,-40 A40,40 0 0,1 28.28,-28.28 Z" fill="#2196F3" stroke="white" stroke-width="2"/>
    <path d="M0,0 L28.28,-28.28 A40,40 0 0,1 40,0 Z" fill="#FF9800" stroke="white" stroke-width="2"/>
    <path d="M0,0 L40,0 A40,40 0 0,1 0,40 Z" fill="#E91E63" stroke="white" stroke-width="2"/>
  </g>
  
  <!-- Data metrics boxes -->
  <rect x="120" y="290" width="80" height="50" fill="rgba(76, 175, 80, 0.1)" rx="5"/>
  <text x="160" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">+24%</text>
  <text x="160" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Growth</text>
  
  <rect x="220" y="290" width="80" height="50" fill="rgba(33, 150, 243, 0.1)" rx="5"/>
  <text x="260" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2196F3">1.2M</text>
  <text x="260" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Users</text>
  
  <rect x="320" y="290" width="80" height="50" fill="rgba(255, 152, 0, 0.1)" rx="5"/>
  <text x="360" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF9800">$50K</text>
  <text x="360" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Revenue</text>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">DATA ANALYTICS</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">Visualization &amp; Insights</text>
</svg>