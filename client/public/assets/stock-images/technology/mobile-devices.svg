<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#techGradient3)"/>
  
  <!-- Phone 1 -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="80" height="140" rx="12" fill="#2C3E50"/>
    <rect x="5" y="15" width="70" height="110" fill="#1A1A1A"/>
    <!-- Screen content -->
    <rect x="10" y="25" width="60" height="8" fill="#4CAF50" rx="2"/>
    <rect x="10" y="38" width="45" height="6" fill="#2196F3" rx="1"/>
    <rect x="10" y="48" width="55" height="6" fill="#FF9800" rx="1"/>
    <!-- App icons -->
    <circle cx="20" cy="70" r="8" fill="#E91E63"/>
    <circle cx="40" cy="70" r="8" fill="#9C27B0"/>
    <circle cx="60" cy="70" r="8" fill="#00BCD4"/>
    <circle cx="20" cy="95" r="8" fill="#4CAF50"/>
    <circle cx="40" cy="95" r="8" fill="#FF5722"/>
    <circle cx="60" cy="95" r="8" fill="#FFC107"/>
    <!-- Home button -->
    <circle cx="40" cy="135" r="5" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Tablet -->
  <g transform="translate(350, 120)">
    <rect x="0" y="0" width="120" height="180" rx="15" fill="#34495E"/>
    <rect x="8" y="20" width="104" height="140" fill="#1A1A1A"/>
    <!-- Screen content -->
    <rect x="15" y="30" width="90" height="15" fill="#4CAF50" rx="3"/>
    <rect x="15" y="50" width="70" height="10" fill="#2196F3" rx="2"/>
    <rect x="15" y="65" width="80" height="10" fill="#FF9800" rx="2"/>
    <rect x="15" y="80" width="85" height="10" fill="#E91E63" rx="2"/>
    <!-- Image placeholder -->
    <rect x="15" y="100" width="90" height="50" fill="rgba(255,255,255,0.1)" rx="5"/>
    <text x="60" y="130" text-anchor="middle" font-family="Arial" font-size="8" fill="rgba(255,255,255,0.5)">IMAGE</text>
  </g>
  
  <!-- Phone 2 -->
  <g transform="translate(520, 140)">
    <rect x="0" y="0" width="85" height="150" rx="15" fill="#2C3E50"/>
    <rect x="5" y="20" width="75" height="110" fill="#1A1A1A"/>
    <!-- App grid -->
    <circle cx="25" cy="45" r="10" fill="#FF6B6B"/>
    <circle cx="45" cy="45" r="10" fill="#4ECDC4"/>
    <circle cx="65" cy="45" r="10" fill="#45B7D1"/>
    <circle cx="25" cy="70" r="10" fill="#F9CA24"/>
    <circle cx="45" cy="70" r="10" fill="#6C5CE7"/>
    <circle cx="65" cy="70" r="10" fill="#A0E7E5"/>
    <circle cx="25" cy="95" r="10" fill="#FF6B9D"/>
    <circle cx="45" cy="95" r="10" fill="#C44569"/>
    <circle cx="65" cy="95" r="10" fill="#F8B500"/>
    <!-- Bottom bar -->
    <rect x="15" y="115" width="55" height="5" fill="rgba(255,255,255,0.3)" rx="2"/>
  </g>
  
  <!-- UI/UX design elements -->
  <g transform="translate(100, 300)">
    <circle cx="0" cy="0" r="8" fill="rgba(255,255,255,0.6)"/>
    <rect x="20" y="-5" width="40" height="10" fill="rgba(255,255,255,0.4)" rx="5"/>
    <polygon points="80,0 90,-8 100,0 90,8" fill="rgba(255,255,255,0.5)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">MOBILE</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">Apps &amp; UI/UX Design</text>
</svg>