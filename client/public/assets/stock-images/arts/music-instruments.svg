<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="musicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="drumGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#f4f4f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#musicGradient)"/>
  
  <!-- Musical notes floating -->
  <g fill="rgba(255,255,255,0.3)" transform="translate(50, 80)">
    <!-- Treble clef -->
    <path d="M10,30 Q15,20 20,25 Q25,30 20,40 Q15,50 10,45 Q5,40 10,30 L10,15 Q15,10 20,15 Q25,20 20,30"/>
    
    <!-- Musical notes -->
    <circle cx="80" cy="40" r="4"/>
    <rect x="84" y="20" width="2" height="20"/>
    
    <circle cx="120" cy="50" r="4"/>
    <rect x="124" y="30" width="2" height="20"/>
    
    <circle cx="160" cy="35" r="4"/>
    <rect x="164" y="15" width="2" height="20"/>
    
    <!-- Staff lines -->
    <line x1="60" y1="30" x2="180" y2="30" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="60" y1="40" x2="180" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="60" y1="50" x2="180" y2="50" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="60" y1="60" x2="180" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="60" y1="70" x2="180" y2="70" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <!-- Piano -->
  <g transform="translate(50, 200)">
    <!-- Piano body -->
    <rect x="0" y="50" width="250" height="120" fill="#2C3E50" rx="5"/>
    <!-- White keys -->
    <rect x="10" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="35" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="60" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="85" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="110" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="135" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="160" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="185" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="210" y="70" width="20" height="80" fill="white" stroke="#ccc" stroke-width="1"/>
    
    <!-- Black keys -->
    <rect x="22" y="70" width="12" height="50" fill="#1A1A1A"/>
    <rect x="47" y="70" width="12" height="50" fill="#1A1A1A"/>
    <rect x="97" y="70" width="12" height="50" fill="#1A1A1A"/>
    <rect x="122" y="70" width="12" height="50" fill="#1A1A1A"/>
    <rect x="147" y="70" width="12" height="50" fill="#1A1A1A"/>
    <rect x="197" y="70" width="12" height="50" fill="#1A1A1A"/>
    <rect x="222" y="70" width="12" height="50" fill="#1A1A1A"/>
    
    <!-- Piano legs -->
    <rect x="20" y="170" width="8" height="40" fill="#2C3E50"/>
    <rect x="220" y="170" width="8" height="40" fill="#2C3E50"/>
  </g>
  
  <!-- Guitar -->
  <g transform="translate(350, 150)">
    <!-- Guitar body -->
    <ellipse cx="50" cy="80" rx="45" ry="65" fill="#8B4513"/>
    <ellipse cx="50" cy="80" rx="35" ry="50" fill="#A0522D"/>
    <circle cx="50" cy="80" r="15" fill="#2C3E50"/>
    
    <!-- Guitar neck -->
    <rect x="45" y="15" width="10" height="65" fill="#654321"/>
    
    <!-- Guitar head -->
    <rect x="42" y="0" width="16" height="20" fill="#654321" rx="3"/>
    
    <!-- Tuning pegs -->
    <circle cx="47" cy="5" r="2" fill="#C0C0C0"/>
    <circle cx="53" cy="5" r="2" fill="#C0C0C0"/>
    <circle cx="47" cy="12" r="2" fill="#C0C0C0"/>
    <circle cx="53" cy="12" r="2" fill="#C0C0C0"/>
    
    <!-- Guitar strings -->
    <line x1="48" y1="20" x2="48" y2="145" stroke="#C0C0C0" stroke-width="0.5"/>
    <line x1="50" y1="20" x2="50" y2="145" stroke="#C0C0C0" stroke-width="0.5"/>
    <line x1="52" y1="20" x2="52" y2="145" stroke="#C0C0C0" stroke-width="0.5"/>
    
    <!-- Frets -->
    <line x1="43" y1="30" x2="57" y2="30" stroke="#C0C0C0" stroke-width="1"/>
    <line x1="43" y1="40" x2="57" y2="40" stroke="#C0C0C0" stroke-width="1"/>
    <line x1="43" y1="50" x2="57" y2="50" stroke="#C0C0C0" stroke-width="1"/>
    <line x1="43" y1="60" x2="57" y2="60" stroke="#C0C0C0" stroke-width="1"/>
  </g>
  
  <!-- Drums -->
  <g transform="translate(500, 180)">
    <!-- Large drum -->
    <ellipse cx="60" cy="120" rx="50" ry="15" fill="#444"/>
    <ellipse cx="60" cy="110" rx="50" ry="15" fill="url(#drumGradient)"/>
    <rect x="10" y="110" width="100" height="40" fill="#666"/>
    <ellipse cx="60" cy="150" rx="50" ry="15" fill="#444"/>
    
    <!-- Small drum -->
    <ellipse cx="120" cy="100" rx="25" ry="8" fill="#444"/>
    <ellipse cx="120" cy="95" rx="25" ry="8" fill="url(#drumGradient)"/>
    <rect x="95" y="95" width="50" height="25" fill="#666"/>
    <ellipse cx="120" cy="120" rx="25" ry="8" fill="#444"/>
    
    <!-- Cymbal -->
    <ellipse cx="30" cy="60" rx="20" ry="3" fill="#FFD700"/>
    <line x1="30" y1="60" x2="30" y2="110" stroke="#666" stroke-width="3"/>
    
    <!-- Drumsticks -->
    <rect x="80" y="70" width="2" height="25" fill="#D2691E" rx="1"/>
    <rect x="85" y="72" width="2" height="25" fill="#D2691E" rx="1"/>
  </g>
  
  <!-- Violin -->
  <g transform="translate(650, 120)">
    <!-- Violin body -->
    <ellipse cx="25" cy="60" rx="18" ry="25" fill="#8B4513"/>
    <ellipse cx="25" cy="40" rx="12" ry="18" fill="#8B4513"/>
    <ellipse cx="25" cy="50" rx="10" ry="15" fill="#A0522D"/>
    
    <!-- F-holes -->
    <path d="M20,45 Q22,50 20,55" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <path d="M30,45 Q28,50 30,55" fill="none" stroke="#2C3E50" stroke-width="2"/>
    
    <!-- Violin neck -->
    <rect x="22" y="15" width="6" height="25" fill="#654321"/>
    
    <!-- Violin head -->
    <path d="M22,0 Q25,5 28,0 Q25,10 25,15" fill="#654321"/>
    
    <!-- Strings -->
    <line x1="23" y1="15" x2="23" y2="85" stroke="#C0C0C0" stroke-width="0.5"/>
    <line x1="25" y1="15" x2="25" y2="85" stroke="#C0C0C0" stroke-width="0.5"/>
    <line x1="27" y1="15" x2="27" y2="85" stroke="#C0C0C0" stroke-width="0.5"/>
    
    <!-- Bridge -->
    <rect x="22" y="55" width="6" height="2" fill="#D2691E"/>
    
    <!-- Bow -->
    <line x1="50" y1="30" x2="80" y2="20" stroke="#654321" stroke-width="3"/>
    <line x1="50" y1="30" x2="80" y2="20" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Sound waves -->
  <g fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2">
    <path d="M250,120 Q300,100 350,120 Q400,140 450,120"/>
    <path d="M300,80 Q350,60 400,80 Q450,100 500,80"/>
    <path d="M350,200 Q400,180 450,200 Q500,220 550,200"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">MUSIC</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">Instruments &amp; Sound</text>
</svg>