<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="artsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#artsGradient)"/>
  
  <!-- Paint palette -->
  <ellipse cx="300" cy="250" rx="120" ry="80" fill="rgba(255,255,255,0.9)"/>
  <!-- Thumb hole -->
  <ellipse cx="350" cy="280" rx="25" ry="15" fill="url(#artsGradient)"/>
  
  <!-- Paint colors on palette -->
  <circle cx="250" cy="220" r="15" fill="#FF6B6B"/>
  <circle cx="280" cy="200" r="12" fill="#4ECDC4"/>
  <circle cx="320" cy="210" r="13" fill="#45B7D1"/>
  <circle cx="290" cy="240" r="14" fill="#F9CA24"/>
  <circle cx="330" cy="240" r="11" fill="#6C5CE7"/>
  <circle cx="250" cy="270" r="12" fill="#A0E7E5"/>
  
  <!-- Paint brushes -->
  <g transform="translate(450, 200)">
    <!-- Brush 1 -->
    <rect x="0" y="0" width="8" height="120" fill="#8B4513"/>
    <ellipse cx="4" cy="-5" rx="6" ry="15" fill="#2C2C2C"/>
    <rect x="2" y="-20" width="4" height="15" fill="#C0C0C0"/>
    
    <!-- Brush 2 -->
    <rect x="20" y="10" width="8" height="110" fill="#8B4513"/>
    <ellipse cx="24" cy="5" rx="5" ry="12" fill="#8B0000"/>
    <rect x="22" y="-10" width="4" height="15" fill="#C0C0C0"/>
    
    <!-- Brush 3 -->
    <rect x="40" y="5" width="8" height="115" fill="#8B4513"/>
    <ellipse cx="44" cy="0" rx="7" ry="18" fill="#2E8B57"/>
    <rect x="41" y="-18" width="6" height="18" fill="#C0C0C0"/>
  </g>
  
  <!-- Color swatches -->
  <rect x="550" y="150" width="40" height="40" fill="#FF6B6B" rx="5"/>
  <rect x="600" y="150" width="40" height="40" fill="#4ECDC4" rx="5"/>
  <rect x="650" y="150" width="40" height="40" fill="#45B7D1" rx="5"/>
  <rect x="550" y="200" width="40" height="40" fill="#F9CA24" rx="5"/>
  <rect x="600" y="200" width="40" height="40" fill="#6C5CE7" rx="5"/>
  <rect x="650" y="200" width="40" height="40" fill="#A0E7E5" rx="5"/>
  
  <!-- Artistic elements -->
  <path d="M100 300 Q150 250 200 300 T300 300" stroke="rgba(255,255,255,0.6)" stroke-width="4" fill="none"/>
  <circle cx="120" cy="150" r="8" fill="rgba(255,255,255,0.7)"/>
  <circle cx="140" cy="170" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="160" cy="160" r="10" fill="rgba(255,255,255,0.7)"/>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">ARTS</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">Creative &amp; Visual</text>
  
  <!-- Decorative elements -->
  <circle cx="80" cy="380" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="720" cy="100" r="30" fill="rgba(255,255,255,0.1)"/>
  <polygon points="700,350 730,330 730,370" fill="rgba(255,255,255,0.1)"/>
</svg>