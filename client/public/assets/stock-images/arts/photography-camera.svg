<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cameraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lensGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#cameraGradient)"/>
  
  <!-- Main DSLR Camera -->
  <g transform="translate(200, 150)">
    <!-- Camera body -->
    <rect x="50" y="50" width="200" height="120" fill="#2C3E50" rx="10"/>
    <rect x="55" y="55" width="190" height="110" fill="#34495E" rx="8"/>
    
    <!-- Lens mount -->
    <circle cx="150" cy="110" r="45" fill="#1A1A1A"/>
    <circle cx="150" cy="110" r="40" fill="#2C3E50"/>
    
    <!-- Main lens -->
    <circle cx="150" cy="110" r="35" fill="url(#lensGradient)"/>
    <circle cx="150" cy="110" r="25" fill="#000"/>
    <circle cx="140" cy="100" r="8" fill="rgba(255,255,255,0.3)"/>
    
    <!-- Camera top -->
    <rect x="80" y="30" width="140" height="25" fill="#2C3E50" rx="5"/>
    
    <!-- Flash -->
    <rect x="90" y="32" width="20" height="8" fill="#FFD700"/>
    
    <!-- Viewfinder -->
    <rect x="160" y="32" width="25" height="8" fill="#1A1A1A"/>
    
    <!-- Mode dial -->
    <circle cx="200" cy="42" r="8" fill="#34495E"/>
    <circle cx="200" cy="42" r="6" fill="#1A1A1A"/>
    <line x1="200" y1="38" x2="200" y2="42" stroke="white" stroke-width="1"/>
    
    <!-- Shutter button -->
    <circle cx="120" cy="42" r="6" fill="#E74C3C"/>
    
    <!-- LCD Screen -->
    <rect x="260" y="80" width="60" height="40" fill="#000" rx="3"/>
    <rect x="262" y="82" width="56" height="36" fill="#1E3A8A" rx="2"/>
    
    <!-- Camera strap -->
    <rect x="70" y="45" width="4" height="10" fill="#654321"/>
    <rect x="226" y="45" width="4" height="10" fill="#654321"/>
  </g>
  
  <!-- Instant Camera -->
  <g transform="translate(50, 280)">
    <!-- Instant camera body -->
    <rect x="0" y="0" width="120" height="80" fill="#FF6B6B" rx="8"/>
    <rect x="5" y="5" width="110" height="70" fill="#FF8E9B" rx="6"/>
    
    <!-- Lens -->
    <circle cx="30" cy="40" r="15" fill="#2C3E50"/>
    <circle cx="30" cy="40" r="10" fill="#000"/>
    
    <!-- Flash -->
    <rect x="55" y="15" width="30" height="8" fill="#FFD700"/>
    
    <!-- Photo slot -->
    <rect x="10" y="85" width="100" height="3" fill="#333"/>
    
    <!-- Photo coming out -->
    <rect x="30" y="88" width="60" height="45" fill="white" stroke="#ccc" stroke-width="1"/>
    <rect x="35" y="93" width="50" height="35" fill="#E8E8E8"/>
  </g>
  
  <!-- Film Roll -->
  <g transform="translate(600, 200)">
    <!-- Film canister -->
    <rect x="0" y="20" width="30" height="80" fill="#666" rx="15"/>
    <rect x="5" y="25" width="20" height="70" fill="#999" rx="10"/>
    
    <!-- Film strip -->
    <rect x="30" y="30" width="80" height="60" fill="#8B4513"/>
    <rect x="35" y="35" width="70" height="50" fill="#A0522D"/>
    
    <!-- Film perforations -->
    <rect x="32" y="35" width="3" height="3" fill="#654321"/>
    <rect x="32" y="42" width="3" height="3" fill="#654321"/>
    <rect x="32" y="49" width="3" height="3" fill="#654321"/>
    <rect x="32" y="56" width="3" height="3" fill="#654321"/>
    <rect x="32" y="63" width="3" height="3" fill="#654321"/>
    <rect x="32" y="70" width="3" height="3" fill="#654321"/>
    <rect x="32" y="77" width="3" height="3" fill="#654321"/>
    
    <rect x="105" y="35" width="3" height="3" fill="#654321"/>
    <rect x="105" y="42" width="3" height="3" fill="#654321"/>
    <rect x="105" y="49" width="3" height="3" fill="#654321"/>
    <rect x="105" y="56" width="3" height="3" fill="#654321"/>
    <rect x="105" y="63" width="3" height="3" fill="#654321"/>
    <rect x="105" y="70" width="3" height="3" fill="#654321"/>
    <rect x="105" y="77" width="3" height="3" fill="#654321"/>
  </g>
  
  <!-- Tripod -->
  <g transform="translate(500, 250)">
    <!-- Tripod legs -->
    <line x1="0" y1="0" x2="-20" y2="50" stroke="#2C3E50" stroke-width="4"/>
    <line x1="0" y1="0" x2="20" y2="50" stroke="#2C3E50" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="50" stroke="#2C3E50" stroke-width="4"/>
    
    <!-- Tripod center -->
    <circle cx="0" cy="0" r="5" fill="#34495E"/>
    
    <!-- Camera mount -->
    <rect x="-10" y="-10" width="20" height="8" fill="#2C3E50" rx="2"/>
  </g>
  
  <!-- Photo frames floating -->
  <g fill="white" stroke="#ddd" stroke-width="2">
    <rect x="120" y="80" width="60" height="45" rx="3"/>
    <rect x="125" y="85" width="50" height="35" fill="#f0f0f0"/>
    
    <rect x="580" y="100" width="45" height="60" rx="3"/>
    <rect x="585" y="105" width="35" height="50" fill="#f0f0f0"/>
    
    <rect x="680" y="300" width="60" height="45" rx="3"/>
    <rect x="685" y="305" width="50" height="35" fill="#f0f0f0"/>
  </g>
  
  <!-- Aperture blades effect -->
  <g transform="translate(600, 50)" fill="rgba(255,255,255,0.1)">
    <polygon points="0,20 10,0 20,20 10,40"/>
    <polygon points="20,0 40,10 20,20 0,10"/>
    <polygon points="40,20 30,40 20,20 30,0"/>
  </g>
  
  <!-- Light rays -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none">
    <line x1="350" y1="260" x2="380" y2="230"/>
    <line x1="350" y1="260" x2="380" y2="290"/>
    <line x1="350" y1="260" x2="400" y2="260"/>
    <line x1="350" y1="260" x2="380" y2="240"/>
    <line x1="350" y1="260" x2="380" y2="280"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">PHOTOGRAPHY</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">Cameras &amp; Imaging</text>
</svg>