<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scienceGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#scienceGradient2)"/>
  
  <!-- Laboratory bench -->
  <rect x="100" y="300" width="600" height="100" fill="#E0E0E0" rx="5"/>
  <rect x="120" y="280" width="560" height="20" fill="#BDBDBD"/>
  
  <!-- Test tubes -->
  <g transform="translate(200, 200)">
    <!-- Test tube rack -->
    <rect x="0" y="80" width="120" height="10" fill="#8B4513"/>
    <circle cx="20" cy="85" r="8" fill="none" stroke="#8B4513" stroke-width="2"/>
    <circle cx="50" cy="85" r="8" fill="none" stroke="#8B4513" stroke-width="2"/>
    <circle cx="80" cy="85" r="8" fill="none" stroke="#8B4513" stroke-width="2"/>
    <circle cx="110" cy="85" r="8" fill="none" stroke="#8B4513" stroke-width="2"/>
    
    <!-- Test tubes -->
    <rect x="16" y="30" width="8" height="55" fill="rgba(255,255,255,0.9)" rx="4"/>
    <rect x="16" y="70" width="8" height="15" fill="#FF6B6B"/>
    
    <rect x="46" y="25" width="8" height="60" fill="rgba(255,255,255,0.9)" rx="4"/>
    <rect x="46" y="70" width="8" height="15" fill="#4ECDC4"/>
    
    <rect x="76" y="35" width="8" height="50" fill="rgba(255,255,255,0.9)" rx="4"/>
    <rect x="76" y="70" width="8" height="15" fill="#45B7D1"/>
    
    <rect x="106" y="40" width="8" height="45" fill="rgba(255,255,255,0.9)" rx="4"/>
    <rect x="106" y="70" width="8" height="15" fill="#F9CA24"/>
  </g>
  
  <!-- Beakers -->
  <g transform="translate(450, 220)">
    <!-- Large beaker -->
    <path d="M20,80 L20,20 Q20,15 25,15 L55,15 Q60,15 60,20 L60,80 Q60,90 50,90 L30,90 Q20,90 20,80 Z" fill="rgba(255,255,255,0.9)"/>
    <rect x="25" y="60" width="30" height="25" fill="#9C27B0" opacity="0.7"/>
    <!-- Measurement marks -->
    <line x1="65" y1="30" x2="70" y2="30" stroke="#666" stroke-width="1"/>
    <line x1="65" y1="45" x2="70" y2="45" stroke="#666" stroke-width="1"/>
    <line x1="65" y1="60" x2="70" y2="60" stroke="#666" stroke-width="1"/>
    <line x1="65" y1="75" x2="70" y2="75" stroke="#666" stroke-width="1"/>
    
    <!-- Small beaker -->
    <path d="M90,70 L90,30 Q90,27 92,27 L108,27 Q110,27 110,30 L110,70 Q110,75 105,75 L95,75 Q90,75 90,70 Z" fill="rgba(255,255,255,0.9)"/>
    <rect x="92" y="55" width="16" height="18" fill="#FF9800" opacity="0.7"/>
  </g>
  
  <!-- Microscope -->
  <g transform="translate(580, 180)">
    <!-- Base -->
    <rect x="10" y="100" width="80" height="15" fill="#2C3E50" rx="7"/>
    <!-- Arm -->
    <rect x="45" y="40" width="10" height="70" fill="#34495E"/>
    <!-- Stage -->
    <rect x="25" y="65" width="50" height="8" fill="#2C3E50"/>
    <!-- Eyepiece -->
    <circle cx="50" cy="35" r="12" fill="#34495E"/>
    <circle cx="50" cy="35" r="8" fill="#1A1A1A"/>
    <!-- Objective lenses -->
    <circle cx="50" cy="65" r="6" fill="#34495E"/>
    <circle cx="50" cy="65" r="3" fill="#1A1A1A"/>
  </g>
  
  <!-- Molecules floating -->
  <g fill="rgba(255,255,255,0.6)">
    <g transform="translate(150, 100)">
      <circle cx="0" cy="0" r="4"/>
      <circle cx="15" cy="8" r="3"/>
      <circle cx="-10" cy="12" r="3"/>
      <line x1="0" y1="0" x2="15" y2="8" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <line x1="0" y1="0" x2="-10" y2="12" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    </g>
    
    <g transform="translate(650, 120)">
      <circle cx="0" cy="0" r="3"/>
      <circle cx="12" cy="5" r="4"/>
      <circle cx="-8" cy="10" r="2"/>
      <line x1="0" y1="0" x2="12" y2="5" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
      <line x1="0" y1="0" x2="-8" y2="10" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">LABORATORY</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">Research &amp; Experiments</text>
</svg>