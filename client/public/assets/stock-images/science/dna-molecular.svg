<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scienceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#scienceGradient)"/>
  
  <!-- DNA Double Helix -->
  <g stroke="rgba(255,255,255,0.8)" stroke-width="6" fill="none">
    <!-- Left strand -->
    <path d="M200 150 Q250 200 300 150 T400 150 T500 150 T600 150" stroke="#FF6B6B"/>
    <!-- Right strand -->
    <path d="M200 300 Q250 250 300 300 T400 300 T500 300 T600 300" stroke="#4ECDC4"/>
    
    <!-- Connecting base pairs -->
    <line x1="225" y1="175" x2="225" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="275" y1="175" x2="275" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="325" y1="175" x2="325" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="375" y1="175" x2="375" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="425" y1="175" x2="425" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="475" y1="175" x2="475" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="525" y1="175" x2="525" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
    <line x1="575" y1="175" x2="575" y2="275" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>
  </g>
  
  <!-- Molecular structures -->
  <!-- Molecule 1 -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="8" fill="#FFD93D"/>
    <circle cx="20" cy="15" r="6" fill="#6BCF7F"/>
    <circle cx="-15" cy="20" r="6" fill="#4D96FF"/>
    <line x1="0" y1="0" x2="20" y2="15" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <line x1="0" y1="0" x2="-15" y2="20" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  </g>
  
  <!-- Molecule 2 -->
  <g transform="translate(650, 350)">
    <circle cx="0" cy="0" r="8" fill="#FF6B9D"/>
    <circle cx="25" cy="0" r="6" fill="#C44569"/>
    <circle cx="12" cy="22" r="6" fill="#F8B500"/>
    <line x1="0" y1="0" x2="25" y2="0" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
    <line x1="0" y1="0" x2="12" y2="22" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">SCIENCE</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)">Research &amp; Discovery</text>
  
  <!-- Decorative elements -->
  <circle cx="70" cy="250" r="20" fill="rgba(255,255,255,0.1)"/>
  <circle cx="730" cy="180" r="25" fill="rgba(255,255,255,0.1)"/>
  <polygon points="50,380 80,360 80,400" fill="rgba(255,255,255,0.1)"/>
  <polygon points="720,50 750,30 750,70" fill="rgba(255,255,255,0.1)"/>
</svg>