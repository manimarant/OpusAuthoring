<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="graduationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcb69f;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="capGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#graduationGradient)"/>
  
  <!-- Confetti -->
  <g fill="#FFD700">
    <rect x="100" y="80" width="4" height="4" rx="1"/>
    <rect x="150" y="120" width="3" height="3" rx="1"/>
    <rect x="200" y="90" width="4" height="4" rx="1"/>
    <rect x="300" y="110" width="3" height="3" rx="1"/>
    <rect x="500" y="85" width="4" height="4" rx="1"/>
    <rect x="600" y="115" width="3" height="3" rx="1"/>
    <rect x="680" y="95" width="4" height="4" rx="1"/>
  </g>
  
  <g fill="#E74C3C">
    <rect x="120" y="100" width="3" height="3" rx="1"/>
    <rect x="180" y="75" width="4" height="4" rx="1"/>
    <rect x="280" y="130" width="3" height="3" rx="1"/>
    <rect x="450" y="70" width="4" height="4" rx="1"/>
    <rect x="550" y="105" width="3" height="3" rx="1"/>
    <rect x="650" y="90" width="4" height="4" rx="1"/>
  </g>
  
  <g fill="#2ECC71">
    <rect x="80" y="110" width="3" height="3" rx="1"/>
    <rect x="160" y="95" width="4" height="4" rx="1"/>
    <rect x="250" y="75" width="3" height="3" rx="1"/>
    <rect x="480" y="125" width="4" height="4" rx="1"/>
    <rect x="580" y="80" width="3" height="3" rx="1"/>
    <rect x="720" y="110" width="4" height="4" rx="1"/>
  </g>
  
  <!-- Main graduate figure -->
  <g transform="translate(350, 150)">
    <!-- Graduation gown -->
    <rect x="0" y="60" width="50" height="120" fill="#2C3E50" rx="5"/>
    <!-- Collar -->
    <rect x="-2" y="55" width="54" height="15" fill="#1A1A1A" rx="3"/>
    
    <!-- Head -->
    <circle cx="25" cy="30" r="20" fill="#FDBCB4"/>
    
    <!-- Graduation cap -->
    <rect x="5" y="15" width="40" height="8" fill="url(#capGradient)" rx="4"/>
    <!-- Mortarboard top -->
    <rect x="0" y="10" width="50" height="3" fill="#2C3E50"/>
    <!-- Tassel -->
    <line x1="45" y1="10" x2="55" y2="0" stroke="#FFD700" stroke-width="2"/>
    <line x1="55" y1="0" x2="60" y2="-5" stroke="#FFD700" stroke-width="2"/>
    <rect x="59" y="-7" width="3" height="4" fill="#FFD700"/>
    
    <!-- Arms -->
    <rect x="-12" y="70" width="18" height="6" fill="#FDBCB4" rx="3"/>
    <rect x="44" y="70" width="18" height="6" fill="#FDBCB4" rx="3"/>
    
    <!-- Diploma in hand -->
    <rect x="65" y="65" width="20" height="3" fill="white" rx="1"/>
    <rect x="65" y="69" width="20" height="3" fill="white" rx="1"/>
    <rect x="87" y="67" width="2" height="4" fill="#E74C3C"/>
    
    <!-- Legs -->
    <rect x="10" y="180" width="12" height="50" fill="#2C3E50"/>
    <rect x="28" y="180" width="12" height="50" fill="#2C3E50"/>
    
    <!-- Shoes -->
    <rect x="8" y="230" width="16" height="8" fill="#1A1A1A" rx="4"/>
    <rect x="26" y="230" width="16" height="8" fill="#1A1A1A" rx="4"/>
  </g>
  
  <!-- Additional graduates in background -->
  <g transform="translate(150, 200)" opacity="0.7">
    <!-- Graduate 2 -->
    <rect x="0" y="40" width="35" height="80" fill="#2C3E50" rx="3"/>
    <circle cx="17" cy="20" r="15" fill="#FDBCB4"/>
    <rect x="-2" y="10" width="38" height="6" fill="#2C3E50" rx="3"/>
    <rect x="-5" y="7" width="44" height="2" fill="#2C3E50"/>
    <!-- Tassel -->
    <line x1="32" y1="7" x2="40" y2="0" stroke="#FFD700" stroke-width="2"/>
  </g>
  
  <g transform="translate(550, 210)" opacity="0.7">
    <!-- Graduate 3 -->
    <rect x="0" y="40" width="35" height="80" fill="#2C3E50" rx="3"/>
    <circle cx="17" cy="20" r="15" fill="#FDBCB4"/>
    <rect x="-2" y="10" width="38" height="6" fill="#2C3E50" rx="3"/>
    <rect x="-5" y="7" width="44" height="2" fill="#2C3E50"/>
    <!-- Tassel -->
    <line x1="32" y1="7" x2="40" y2="0" stroke="#FFD700" stroke-width="2"/>
  </g>
  
  <!-- University building silhouette -->
  <g transform="translate(50, 250)" fill="#34495E" opacity="0.6">
    <!-- Main building -->
    <rect x="0" y="50" width="120" height="100" />
    <!-- Columns -->
    <rect x="10" y="50" width="8" height="100"/>
    <rect x="25" y="50" width="8" height="100"/>
    <rect x="40" y="50" width="8" height="100"/>
    <rect x="55" y="50" width="8" height="100"/>
    <rect x="70" y="50" width="8" height="100"/>
    <rect x="85" y="50" width="8" height="100"/>
    <rect x="102" y="50" width="8" height="100"/>
    
    <!-- Dome -->
    <path d="M40,50 Q60,25 80,50" fill="#2C3E50"/>
    <!-- Flagpole -->
    <line x1="60" y1="25" x2="60" y2="10" stroke="#8B4513" stroke-width="2"/>
    <rect x="60" y="10" width="15" height="8" fill="#E74C3C"/>
  </g>
  
  <!-- Books stack -->
  <g transform="translate(600, 320)">
    <rect x="0" y="20" width="40" height="6" fill="#E74C3C"/>
    <rect x="0" y="14" width="42" height="6" fill="#2ECC71"/>
    <rect x="0" y="8" width="38" height="6" fill="#3498DB"/>
    <rect x="0" y="2" width="40" height="6" fill="#9B59B6"/>
  </g>
  
  <!-- Achievement medal -->
  <g transform="translate(150, 320)">
    <circle cx="20" cy="20" r="18" fill="#FFD700"/>
    <circle cx="20" cy="20" r="12" fill="#FFA500"/>
    <text x="20" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">1</text>
    <!-- Ribbon -->
    <rect x="18" y="38" width="4" height="20" fill="#E74C3C"/>
    <polygon points="16,58 22,52 24,58" fill="#C0392B"/>
  </g>
  
  <!-- Success stars -->
  <g fill="#FFD700" opacity="0.8">
    <polygon points="100,50 102,56 108,56 103,60 105,66 100,62 95,66 97,60 92,56 98,56" />
    <polygon points="300,40 301,44 305,44 302,47 303,51 300,49 297,51 298,47 295,44 299,44" />
    <polygon points="650,60 652,66 658,66 653,70 655,76 650,72 645,76 647,70 642,66 648,66" />
    <polygon points="720,45 721,49 725,49 722,52 723,56 720,54 717,56 718,52 715,49 719,49" />
  </g>
  
  <!-- Fireworks effect -->
  <g stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none">
    <circle cx="200" cy="100" r="15"/>
    <circle cx="200" cy="100" r="20"/>
    <circle cx="200" cy="100" r="25"/>
    
    <circle cx="600" cy="80" r="12"/>
    <circle cx="600" cy="80" r="18"/>
    <circle cx="600" cy="80" r="24"/>
  </g>
  
  <!-- Inspirational text bubble -->
  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="100" height="40" fill="rgba(255,255,255,0.9)" rx="8"/>
    <polygon points="20,40 25,50 30,40" fill="rgba(255,255,255,0.9)"/>
    <text x="50" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2C3E50">Congratulations!</text>
    <text x="50" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2C3E50">You did it!</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#2C3E50">GRADUATION</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(44,62,80,0.8)">Success &amp; Achievement</text>
</svg>